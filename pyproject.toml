[project]
name = "lightjunction"
version = "0.1.0"
description = "LightJunction profile and local tooling checks"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.15.16",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
files = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".kimaki",
    ".omo",
    "workspace",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "B011",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
