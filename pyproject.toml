[project]
name = "lightjunction"
version = "0.1.0"
description = "LIghtJUNction personal homepage and GitHub automation"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.15.16",
    "types-requests>=2.33.0.20260518",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
files = [
    "scripts",
    "tests",
    "skills",
]

[[tool.mypy.overrides]]
module = [
    "fetch_github_data",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".kimaki",
    ".omo",
    "workspace",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "B011",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
