<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 60px 20px 40px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            font-size: 13px;
            font-weight: 400;
            color: #444;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 10px;
            color: #333;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
            padding: 14px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #333;
        }
        textarea {
            min-height: 140px;
            resize: none;
            line-height: 1.6;
        }
        .btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 2px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }
        .btn:hover { background: #e0e0e0; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .result {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 2px;
        }
        .result.show { display: block; }
        .result-label {
            font-size: 10px;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .result-content {
            font-size: 11px;
            color: #555;
            word-break: break-all;
            max-height: 120px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .msg {
            font-size: 11px;
            color: #444;
            margin-top: 12px;
            text-align: center;
        }
        .msg.ok { color: #6a6; }
        .msg.err { color: #a66; }
        .hint {
            font-size: 10px;
            color: #2a2a2a;
            margin-top: 30px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>// SECURE MESSAGE</h1>

        <div class="field">
            <label>subject</label>
            <input type="text" id="title" placeholder="what's this about">
        </div>

        <div class="field">
            <label>secret message</label>
            <textarea id="message" placeholder="write something only the recipient can read..."></textarea>
        </div>

        <button class="btn" id="encryptBtn">encrypt</button>

        <div class="result" id="result">
            <div class="result-label">encrypted output</div>
            <div class="result-content" id="output"></div>
            <div class="msg" id="msg"></div>
            <button class="btn" id="sendBtn">create issue on github</button>
        </div>

        <div class="hint">
            messages are encrypted in your browser<br>
            only the recipient with the private key can decrypt
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
