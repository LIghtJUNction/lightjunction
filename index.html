<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
        }
        h1 {
            font-size: 14px;
            font-weight: 400;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .card {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #444;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        button {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #333;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        button:hover {
            background: #222;
            color: #aaa;
        }
        button.primary {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        button.primary:hover {
            background: #ddd;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .output {
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 12px;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .output.show {
            display: block;
        }
        .msg {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .msg.error { color: #c44; }
        .msg.success { color: #4a4; }
        .hint {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>// SECURE MESSAGE</h1>

        <div class="card">
            <label>public key</label>
            <div style="font-size:10px;color:#555;word-break:break-all;padding:8px;background:#0d0d0d;border-radius:4px;" id="pubkey">loading...</div>
        </div>

        <div class="card">
            <label>title (optional)</label>
            <input type="text" id="title" placeholder="subject">
        </div>

        <div class="card">
            <label>message</label>
            <textarea id="message" placeholder="your private message..."></textarea>
            <div class="btn-row">
                <button class="primary" id="encryptBtn">encrypt</button>
                <button id="copyBtn">copy</button>
                <button id="clearBtn">clear</button>
            </div>
        </div>

        <div class="card" id="outputCard" style="display:none;">
            <label>encrypted</label>
            <div class="output" id="output"></div>
            <div class="msg" id="msg"></div>
            <div class="btn-row">
                <button id="postBtn">post to github</button>
            </div>
            <div class="hint">post creates a public issue with the encrypted message</div>
        </div>

        <div class="card">
            <label>github token (optional)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxx">
            <div class="hint">only needed for posting to github. your token is never stored.</div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
