<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        .scene {
            width: 280px;
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }
        .envelope {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .envelope.open { transform: rotateX(-160deg); }
        .envelope.sent {
            transform: translateY(-200px) rotateX(-30deg);
            opacity: 0;
            transition: all 0.8s ease-in;
        }
        .envelope-front, .envelope-back, .envelope-flap, .envelope-content {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
        }
        .envelope-front {
            background: linear-gradient(145deg, #1a1a1a, #111);
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .envelope-flap {
            background: linear-gradient(180deg, #222, #1a1a1a);
            border: 1px solid #2a2a2a;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            transform-origin: top center;
            transition: transform 0.4s ease-out;
            z-index: 2;
        }
        .envelope.open .envelope-flap { transform: rotateX(180deg); }
        .envelope-back {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            transform: rotateX(180deg);
        }
        .envelope-content {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 16px;
            transform: rotateX(180deg);
            z-index: 1;
        }
        .to-line {
            font-size: 10px;
            color: #444;
            margin-bottom: 8px;
        }
        .from-line {
            font-size: 10px;
            color: #444;
            margin-top: auto;
            text-align: right;
        }
        .title-on-env {
            font-size: 11px;
            color: #666;
            max-width: 200px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .env-icon {
            font-size: 32px;
            margin-bottom: 8px;
            filter: grayscale(1);
            opacity: 0.6;
        }
        .hint-text {
            font-size: 10px;
            color: #333;
            margin-top: 4px;
        }
        .input-area {
            width: 280px;
            margin-top: 20px;
            display: none;
        }
        .input-area.show { display: block; }
        input, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 12px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #444;
        }
        textarea {
            min-height: 100px;
            resize: none;
        }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            background: #1a1a1a;
            color: #888;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.2s;
        }
        button:hover { background: #222; color: #aaa; }
        button.primary { background: #fff; color: #000; border-color: #fff; }
        button.primary:hover { background: #ddd; }
        .status {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin-top: 12px;
            min-height: 16px;
        }
        .status.ok { color: #4a4; }
        .status.err { color: #c44; }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            color: #333;
            cursor: pointer;
        }
        .close-btn:hover { color: #666; }
        .pubkey-small {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 9px;
            color: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="close-btn" id="resetBtn">reset</div>

    <div class="scene" id="scene">
        <div class="envelope" id="envelope">
            <div class="envelope-front">
                <div class="env-icon">✉</div>
                <div class="title-on-env" id="envTitle">tap to open</div>
                <div class="hint-text" id="envHint">slide to flip</div>
            </div>
            <div class="envelope-flap"></div>
            <div class="envelope-back"></div>
            <div class="envelope-content">
                <div class="to-line">TO: LIghtJUNction</div>
                <textarea id="secretMsg" placeholder="write your secret..."></textarea>
                <div class="from-line">FROM: anonymous</div>
            </div>
        </div>
    </div>

    <div class="input-area" id="inputArea">
        <input type="text" id="titleInput" placeholder="subject (visible on envelope)">
        <div class="btn-row">
            <button id="encryptBtn" class="primary">encrypt & seal</button>
            <button id="cancelBtn">cancel</button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <div class="pubkey-small">EB21B83... encrypted</div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
