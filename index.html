<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #0a0a0a;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        /* bg */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 30% 30%, rgba(0,255,136,0.03) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(255,0,136,0.02) 0%, transparent 40%),
                #0a0a0a;
        }
        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,136,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        /* card */
        .card {
            position: absolute;
            width: 280px;
            background: linear-gradient(145deg, #111, #0d0d0d);
            border: 1px solid rgba(0,255,136,0.12);
            border-radius: 8px;
            padding: 20px 18px 20px;
            cursor: grab;
            box-shadow:
                0 0 50px rgba(0,255,136,0.06),
                0 20px 60px rgba(0,0,0,0.4);
            transform-origin: center center;
        }
        .card:active { cursor: grabbing; }
        /* lines */
        .card::before {
            content: '';
            position: absolute;
            top: 44px; left: 18px; right: 18px; bottom: 44px;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 20px,
                rgba(0,255,136,0.05) 20px,
                rgba(0,255,136,0.05) 21px
            );
            pointer-events: none;
        }
        .title {
            font-size: 8px;
            color: rgba(0,255,136,0.5);
            letter-spacing: 3px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0,255,136,0.1);
            margin-bottom: 14px;
        }
        textarea {
            width: 100%;
            height: 160px;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 12px;
            line-height: 21px;
            color: #d0d0d0;
            outline: none;
        }
        textarea::placeholder { color: rgba(255,255,255,0.12); }
        /* button */
        /* result */
        .result {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .result.show { display: flex; }
        .result-box {
            background: #0f0f0f;
            border: 1px solid rgba(0,255,136,0.15);
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
        }
        .result-label {
            font-size: 8px;
            color: #00ff88;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .result-text {
            background: #080808;
            border-radius: 4px;
            padding: 12px;
            font-size: 9px;
            color: rgba(255,255,255,0.4);
            word-break: break-all;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .result-btns {
            display: flex;
            gap: 8px;
        }
        .result-btn {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 9px;
            cursor: pointer;
            border: 1px solid rgba(0,255,136,0.2);
            background: rgba(0,255,136,0.08);
            color: #00ff88;
        }
        .result-btn:hover { background: rgba(0,255,136,0.15); }
        .result-btn.dark {
            border-color: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            background: transparent;
        }
        /* status */
        .status {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #00ff88;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 50;
            pointer-events: none;
        }
        .status.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="card" id="card">
        <div class="title">SECURE MESSAGE</div>
        <textarea id="msg" placeholder="secret..."></textarea>
    </div>

    <div class="result" id="result">
        <div class="result-box">
            <div class="result-label">ENCRYPTED</div>
            <div class="result-text" id="out"></div>
            <div class="result-btns">
                <button class="result-btn" id="cp">COPY</button>
                <button class="result-btn" id="gh">GITHUB</button>
                <button class="result-btn dark" id="cl">×</button>
            </div>
        </div>
    </div>

    <div class="status" id="st"></div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
