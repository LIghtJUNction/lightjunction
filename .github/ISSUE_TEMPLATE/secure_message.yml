name: 🔒 Secure Message
description: Send an encrypted message to the repo owner (uses GPG encryption)
title: "[Encrypted] "
body:
  - type: markdown
    attributes:
      value: |
        ## 🔐 Encrypted Message

        Your message will be automatically encrypted with the owner's GPG public key.
        Only the owner can decrypt it with their private key.

  - type: textarea
    id: message
    attributes:
      label: Your Message
      description: Write your message below. It will be encrypted automatically.
      placeholder: |
        Type your private message here...

        Your message will be encrypted using GPG and only the repo owner can read it.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I understand this message will be encrypted publicly and only the owner can decrypt it.
          required: true
