name: Code Executor from Issue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  execute-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Extract and Execute Code
        id: execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          uv run --no-project - <<'PYTHON'
          # /// script
          # requires-python = ">=3.10"
          # dependencies = [
          #   "requests>=2.31.0",
          # ]
          # ///
          
          import os
          import re
          import subprocess
          import sys
          
          def extract_code_blocks(text):
              """Extract Python code blocks from markdown text."""
              # Pattern to match ```python or ``` code blocks
              pattern = r'```(?:python)?\s*\n(.*?)```'
              matches = re.findall(pattern, text, re.DOTALL)
              return matches
          
          def execute_python_code(code):
              """Execute Python code and capture output."""
              try:
                  # Write code to temporary file
                  with open('/tmp/issue_code.py', 'w') as f:
                      f.write(code)
                  
                  # Execute the code
                  result = subprocess.run(
                      [sys.executable, '/tmp/issue_code.py'],
                      capture_output=True,
                      text=True,
                      timeout=60
                  )
                  
                  output = {
                      'success': result.returncode == 0,
                      'stdout': result.stdout,
                      'stderr': result.stderr,
                      'returncode': result.returncode
                  }
                  
                  return output
              except subprocess.TimeoutExpired:
                  return {
                      'success': False,
                      'stdout': '',
                      'stderr': 'Execution timeout (60 seconds exceeded)',
                      'returncode': -1
                  }
              except Exception as e:
                  return {
                      'success': False,
                      'stdout': '',
                      'stderr': str(e),
                      'returncode': -1
                  }
          
          # Main execution
          issue_body = os.environ.get('ISSUE_BODY', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')
          
          print(f"Processing issue #{issue_number}")
          
          # Extract code blocks
          code_blocks = extract_code_blocks(issue_body)
          
          if not code_blocks:
              print("No code blocks found in issue")
              with open('/tmp/execution_result.txt', 'w') as f:
                  f.write("No code blocks found in issue body")
              sys.exit(0)
          
          print(f"Found {len(code_blocks)} code block(s)")
          
          # Execute each code block
          results = []
          for idx, code in enumerate(code_blocks, 1):
              print(f"\nExecuting code block {idx}...")
              result = execute_python_code(code)
              results.append((idx, result))
              
              if result['success']:
                  print(f"✓ Code block {idx} executed successfully")
              else:
                  print(f"✗ Code block {idx} failed")
          
          # Save results
          with open('/tmp/execution_result.txt', 'w') as f:
              f.write(f"# Execution Results\n\n")
              for idx, result in results:
                  f.write(f"## Code Block {idx}\n\n")
                  f.write(f"**Status:** {'✓ Success' if result['success'] else '✗ Failed'}\n\n")
                  
                  if result['stdout']:
                      f.write(f"**Output:**\n```\n{result['stdout']}\n```\n\n")
                  
                  if result['stderr']:
                      f.write(f"**Errors:**\n```\n{result['stderr']}\n```\n\n")
          
          print("\nExecution complete!")
          PYTHON

      - name: Update README if output exists
        run: |
          # Check if the execution created any output files that should update README
          if [ -f "/tmp/readme_update.txt" ]; then
            echo "Found README update content"
            # This is a placeholder for updating README based on code execution output
            # You can customize this based on your needs
            cat /tmp/readme_update.txt >> Readme.md
          fi

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if ! git diff --quiet; then
            echo "Changes detected, committing..."
            git add .
            git commit -m "Code execution from issue #${{ github.event.issue.number }}"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Comment Result on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = '';
            try {
              result = fs.readFileSync('/tmp/execution_result.txt', 'utf8');
            } catch (e) {
              result = 'No execution result available';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result
            });
