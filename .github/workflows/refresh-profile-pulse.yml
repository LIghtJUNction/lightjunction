name: Refresh Profile SVG

on:
  schedule:
    - cron: "31 22 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-profile-svg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            scripts/*.py

      - name: Refresh README profile SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: uv run scripts/update_profile_pulse.py

      - name: Commit profile SVG
        run: |
          if [ -z "$(git status --porcelain README.md PROFILE_ACTIONS.md public/profile-hero.svg public/profile-pulse.svg public/profile-projects.svg public/profile-actions.svg public/profile-readme.svg)" ]; then
            echo "No profile SVG changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md PROFILE_ACTIONS.md public/profile-hero.svg public/profile-pulse.svg public/profile-projects.svg public/profile-actions.svg
          git rm -f --ignore-unmatch public/profile-readme.svg
          git commit -m "chore: refresh profile svg"
          git push
