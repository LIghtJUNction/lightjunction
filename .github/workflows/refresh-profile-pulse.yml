name: Refresh Profile Pulse

on:
  schedule:
    - cron: "31 22 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-profile-pulse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            scripts/*.py

      - name: Refresh README profile pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: uv run scripts/update_profile_pulse.py

      - name: Commit profile pulse
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "No profile pulse changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile pulse"
          git push
