name: 🧬 Self-Evolving Agent (IMMUTABLE)

# ⚠️ WARNING: This workflow file is IMMUTABLE and should NOT be modified
# Any changes to this file will break the self-evolution system
# Version: 1.0.0-IMMUTABLE

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force evolution cycle'
        required: false
        default: 'false'

jobs:
  evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 🐍 Set up Python
        run: uv python install 3.12

      - name: 📦 Install dependencies
        run: |
          uv pip install --system requests

      - name: 🧬 Run Self-Evolution Cycle
        id: evolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting evolution cycle..."
          python self_evolve_agent.py > evolution_log.txt 2>&1 || true
          
          echo "Evolution cycle completed"
          
          # Output log for review
          echo "EVOLUTION_LOG<<EOF" >> $GITHUB_OUTPUT
          cat evolution_log.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Check if there are changes
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Display Evolution Log
        run: |
          echo "=== Evolution Log ==="
          cat evolution_log.txt
          echo "===================="

      - name: 💾 Commit and Push Changes
        if: steps.evolve.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'self-evolve-bot[bot]'
          git config --global user.email 'self-evolve-bot[bot]@users.noreply.github.com'
          
          # Get current date for commit message
          CURRENT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          # Read config to determine which version was updated
          VERSION=$(python -c "import json; print(json.load(open('agent_config.json'))['current_version'])")
          
          git add -A
          git commit -m "🧬 Auto-evolution: Version $VERSION updated - $CURRENT_DATE

          This commit was automatically generated by the self-evolving agent system.
          
          Changes:
          - Python files evolved using AI analysis
          - A/B testing cycle: Version $VERSION
          - Model: gpt-4o-mini (free tier)
          
          See agent_config.json for evolution history."
          
          git push

      - name: 📝 Create Evolution Report Issue (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('evolution_log.txt', 'utf8');
            } catch (e) {
              log = 'Could not read evolution log';
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🧬 Self-Evolution Cycle Failed',
              body: `## Evolution Cycle Failed
              
              **Time:** ${new Date().toISOString()}
              **Workflow Run:** ${context.runId}
              
              ### Log Output
              
              \`\`\`
              ${log.slice(0, 10000)}
              \`\`\`
              
              Please review the logs and check for issues.
              `,
              labels: ['self-evolution', 'automated']
            });

      - name: ✅ Evolution Complete
        if: success()
        run: |
          echo "🎉 Self-evolution cycle completed successfully!"
          echo "📊 Check agent_config.json for evolution history"

# ⚠️ DO NOT MODIFY THIS FILE
# This workflow is designed to be immutable to ensure system stability
# If you need to change evolution behavior, modify self_evolve_agent.py instead
