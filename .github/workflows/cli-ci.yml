name: CLI CI

on:
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli-*.yml']
  pull_request:
    paths: ['cli/**', '.github/workflows/cli-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Test release safeguards
        run: uv run --no-project python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check crates.io package
        if: runner.os == 'Linux'
        run: cargo publish --dry-run --locked

