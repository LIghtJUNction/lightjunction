name: 🔒 Encrypt Issue Message

on:
  issues:
    types: [opened]

jobs:
  encrypt-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Import GPG Key
        run: gpg --import pubkey.asc 2>/dev/null || echo "Key import attempted"

      - name: Encrypt Issue
        id: encrypt
        run: |
          CONTENT="Title: ${{ github.event.issue.title }}

          Body: ${{ github.event.issue.body }}"

          ENCRYPTED=$(echo "$CONTENT" | gpg --batch --yes --encrypt --armor --recipient EB21B83AB1E982DF66F08387A67178405F7736FD 2>/dev/null)

          echo "$ENCRYPTED" > encrypted.txt
          echo "done=1" >> $GITHUB_OUTPUT

      - name: Post Comment
        if: steps.encrypt.outputs.done == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const enc = fs.readFileSync('encrypted.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔐 Encrypted Message

This message is encrypted with the owner's GPG public key.
Only the owner (holding the private key) can decrypt it.

\`\`\`
${enc}
\`\`\`

---
*Auto-encrypted by GitHub Action*`
            });
