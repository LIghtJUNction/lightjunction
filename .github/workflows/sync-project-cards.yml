name: Sync Project Cards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-project-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fetch + commit
    if: github.repository == 'LIghtJUNction/lightjunction'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            scripts/*.py

      - name: Fetch project cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_PROJECTS_PATH: public/github-projects.json
        run: uv run scripts/fetch-github-data.py

      - name: Commit project cards
        run: |
          if git diff --quiet -- public/github-projects.json; then
            echo "No project card changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-projects.json
          git commit -m "chore: sync project cards"
          git fetch origin main
          git rebase origin/main
          git push
