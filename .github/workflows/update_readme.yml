name: 📊 Update Readme Weekly (Enhanced with AI)

on:
  schedule:
    - cron: '0 0 * * 0' # 每周日午夜运行 (UTC time, 北京时间周日早上8点)
  workflow_dispatch: # 允许手动触发 (Allow manual trigger)

jobs:
  update_readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入仓库内容的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy
          
      - name: Install Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk

      - name: Run script to get data and generate image
        id: run_script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_readme_data.py > script_output.txt
          echo "TITLE_IMG_PATH=$(grep 'TITLE_IMG_PATH:' script_output.txt | cut -d':' -f2- | tr -d '\r\n')" >> $GITHUB_OUTPUT
          echo "REPO_LIST_MD<<EOF" >> $GITHUB_OUTPUT
          sed -n '/---REPO_LIST_START---/,/---REPO_LIST_END---/{ /---REPO_LIST_START---/d; /---REPO_LIST_END---/d; p; }' script_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "COMMITS_MD<<EOF" >> $GITHUB_OUTPUT
          sed -n '/---COMMITS_START---/,/---COMMITS_END---/{ /---COMMITS_START---/d; /---COMMITS_END---/d; p; }' script_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "SUMMARY_MD<<EOF" >> $GITHUB_OUTPUT
          sed -n '/---SUMMARY_START---/,/---SUMMARY_END---/{ /---SUMMARY_START---/d; /---SUMMARY_END---/d; p; }' script_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "--- Script Output (script_output.txt) ---"
          cat script_output.txt
          echo "--- End of Script Output ---"

      - name: Update Readme.md
        env:
          TITLE_IMG_PATH_VALUE: ${{ steps.run_script.outputs.TITLE_IMG_PATH }}
          REPO_LIST_MD_VALUE: ${{ steps.run_script.outputs.REPO_LIST_MD }}
          COMMITS_MD_VALUE: ${{ steps.run_script.outputs.COMMITS_MD }}
          SUMMARY_MD_VALUE: ${{ steps.run_script.outputs.SUMMARY_MD }}
        run: |
          echo "Received Title Image Path: $TITLE_IMG_PATH_VALUE"

          if [ -z "$TITLE_IMG_PATH_VALUE" ] || [ -z "$REPO_LIST_MD_VALUE" ]; then
            echo "Error: Script output variables are not set correctly."
            exit 1
          fi

          # Write content to temporary files to safely handle special characters/newlines
          echo "![最新项目]($TITLE_IMG_PATH_VALUE)" > title_image_insert.txt
          echo "$REPO_LIST_MD_VALUE" > repo_list_insert.txt
          echo "$COMMITS_MD_VALUE" > commits_insert.txt
          echo "$SUMMARY_MD_VALUE" > summary_insert.txt
          
          # For debugging
          echo "--- repo_list_insert.txt content ---"
          cat repo_list_insert.txt
          echo "--- end of repo_list_insert.txt content ---"

          START_COMMENT_TITLE_IMG="<!-- START_DYNAMIC_TITLE_IMAGE -->"
          END_COMMENT_TITLE_IMG="<!-- END_DYNAMIC_TITLE_IMAGE -->"
          START_COMMENT_REPO_LIST="<!-- START_DYNAMIC_REPO_LIST -->"
          END_COMMENT_REPO_LIST="<!-- END_DYNAMIC_REPO_LIST -->"
          START_COMMENT_COMMITS="<!-- START_DYNAMIC_COMMITS -->"
          END_COMMENT_COMMITS="<!-- END_DYNAMIC_COMMITS -->"
          START_COMMENT_SUMMARY="<!-- START_DYNAMIC_SUMMARY -->"
          END_COMMENT_SUMMARY="<!-- END_DYNAMIC_SUMMARY -->"

          cp Readme.md Readme.md.tmp

          # Update title image section
          awk -v start="$START_COMMENT_TITLE_IMG" -v end="$END_COMMENT_TITLE_IMG" '
          BEGIN {p=1}
          $0 == start {print; printf "\n"; system("cat title_image_insert.txt"); printf "\n"; p=0}
          $0 == end {p=1}
          p {print}
          ' Readme.md.tmp > Readme.md.new && mv Readme.md.new Readme.md.tmp

          # Update repo list section
          awk -v start="$START_COMMENT_REPO_LIST" -v end="$END_COMMENT_REPO_LIST" '
          BEGIN {p=1}
          $0 == start {print; printf "\n"; system("cat repo_list_insert.txt"); printf "\n"; p=0}
          $0 == end {p=1}
          p {print}
          ' Readme.md.tmp > Readme.md.new && mv Readme.md.new Readme.md.tmp

          # Update commits section
          awk -v start="$START_COMMENT_COMMITS" -v end="$END_COMMENT_COMMITS" '
          BEGIN {p=1}
          $0 == start {print; printf "\n"; system("cat commits_insert.txt"); printf "\n"; p=0}
          $0 == end {p=1}
          p {print}
          ' Readme.md.tmp > Readme.md.new && mv Readme.md.new Readme.md.tmp

          # Update summary section
          awk -v start="$START_COMMENT_SUMMARY" -v end="$END_COMMENT_SUMMARY" '
          BEGIN {p=1}
          $0 == start {print; printf "\n"; system("cat summary_insert.txt"); printf "\n"; p=0}
          $0 == end {p=1}
          p {print}
          ' Readme.md.tmp > Readme.md.new && mv Readme.md.new Readme.md.tmp

          mv Readme.md.tmp Readme.md
          rm title_image_insert.txt repo_list_insert.txt commits_insert.txt summary_insert.txt

          echo "Readme.md updated locally."

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # git status # For debugging

          # Check if there are any changes in Readme.md, generated_images directory, or archives
          # Add archives/* to ensure archived reports are committed
          if ! git diff --quiet Readme.md generated_images/ archives/ 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard archives/)" ]; then
            echo "Changes detected in Readme.md, generated_images/, or archives/."
            git add Readme.md generated_images/ archives/
            git commit -m "自动化: 更新最新项目列表、标题图片和周报存档 (Automated: Update latest projects, title image, and weekly report archives)"
            git push
          else
            echo "No changes to commit."
          fi
