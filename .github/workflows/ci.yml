name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell / syntax + ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the runner's ShellCheck
        run: shellcheck --version

      - name: Run scripts/check-shell.sh
        run: scripts/check-shell.sh

  python:
    name: Python / ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run scripts/check-python.sh
        run: scripts/check-python.sh

  frontend:
    name: Frontend / typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned age for ciphertext validation
        run: bash cli/scripts/install-crypto-test-tools.sh --age-only

      - name: Install npm dependencies
        run: npm ci

      - name: Run scripts/check-frontend.sh
        run: scripts/check-frontend.sh

  ci:
    name: CI
    needs: [shell, python, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs did not succeed." >&2
          exit 1
