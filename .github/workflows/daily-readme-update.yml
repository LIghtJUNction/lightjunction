name: Daily README Update with AI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

env:
  OPENAI_BASE_URL: https://models.githubusercontent.com/v1
  OPENAI_MODEL: gpt-4o-mini
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gh extension
        run: gh extension install github/gh-skyline

      - name: Generate Skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skyline -u LIghtJUNction -y 2022-2026 --art-only > skyline.txt

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.py"

      - name: Fetch GitHub Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TEAM_ORGS: SlashNephy
        run: uv run scripts/fetch-github-data.py

      - name: AI Enhancement
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: uv run scripts/ai-enhance.py

      - name: Update README
        run: uv run scripts/update-readme.py

      - name: Commit and Push
        if: github.event_name != 'push'
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: daily update $(date -u +'%Y-%m-%d')"
          git push
