name: Daily README Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install gh extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install github/gh-skyline

      - name: Generate Skyline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skyline -u LIghtJUNction -f --art-only > skyline.txt

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.py"

      - name: Fetch GitHub Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TEAM_ORGS: SlashNephy
        run: uv run scripts/fetch-github-data.py

      - name: Update README
        run: uv run scripts/update-readme.py

      - name: Update dotenv
        run: curl -fsSL https://raw.githubusercontent.com/LIghtJUNction/lightjunction/main/scripts/get_api_key.sh | bash | tee .env

      - name: Commit and Push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet README.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: daily update $(date -u +'%Y-%m-%d')"
          git push

