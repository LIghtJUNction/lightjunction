repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-Pillow
        files: ^(update_readme_data|process_code_showcase|process_qa|self_evolve_agent|meta_agent).*\.py$
        args: [--ignore-missing-imports, --no-strict-optional]

  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python syntax check
        entry: python -m py_compile
        language: system
        types: [python]
        pass_filenames: true

      - id: check-immutable-files
        name: Check immutable files protection
        entry: bash -c 'if git diff --cached --name-only | grep -E "(meta_agent\.py|\.github/workflows/main\.yml)"; then echo "❌ ERROR: Immutable files cannot be modified!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-ab-versions
        name: Validate A/B version consistency
        entry: python .pre-commit-hooks/validate_ab_versions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: backup-before-evolution
        name: Create backup before evolution changes
        entry: python .pre-commit-hooks/create_backup.py
        language: system
        pass_filenames: false
        always_run: true

      - id: test-evolution-files
        name: Test evolution agent files
        entry: python .pre-commit-hooks/test_evolution.py
        language: system
        files: ^(self_evolve_agent|meta_agent|orchestrator)\.py$
        pass_filenames: true

      - id: validate-config-json
        name: Validate configuration JSON files
        entry: python .pre-commit-hooks/validate_configs.py
        language: system
        files: ^(agent_config|meta_agent_config)\.json$
        pass_filenames: true

      - id: check-evolution-safety
        name: Check evolution system safety
        entry: python .pre-commit-hooks/check_safety.py
        language: system
        pass_filenames: false
        always_run: true
