repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-Pillow
        files: ^(update_readme_data|process_code_showcase|process_qa|self_evolve_agent|meta_agent).*\.py$
        args: [--ignore-missing-imports, --no-strict-optional]

  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python syntax check
        entry: python -m py_compile
        language: system
        types: [python]
        pass_filenames: true

      - id: check-immutable-files
        name: Check immutable files
        entry: bash -c 'if git diff --cached --name-only | grep -E "(meta_agent\.py|\.github/workflows/meta_evolve\.yml)"; then echo "ERROR: Immutable files cannot be modified!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
