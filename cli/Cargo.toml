[package]
name = "lightjunction"
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
description = "Public-key export and local age/OpenPGP file encryption"
license-file = "LICENSE"
repository = "https://github.com/LIghtJUNction/lightjunction"
homepage = "https://lightjunction.github.io/lightjunction/"
readme = "README.md"
keywords = ["cli", "public-key", "age", "openpgp", "encryption"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "keys/**", "install.sh", "install.ps1", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE", "UPSTREAM.toml"]

[dependencies]
zclap = "=0.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

