<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction selected projects</title>
  <desc id="desc">Generated LIghtJUNction README panel with restrained editorial animation. Click the image in README for links and copyable commands.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="58%" stop-color="#f4f0e8"/>
      <stop offset="100%" stop-color="#ece4d6"/>
    </linearGradient>
    <linearGradient id="ink-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="46%" stop-color="#171717"/>
      <stop offset="72%" stop-color="#8f6a35"/>
      <stop offset="100%" stop-color="#171717"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.18 0;0.18 0;-0.18 0" dur="13s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3d3428" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1d1a16" stroke-opacity="0.035" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;24 24;0 0" dur="36s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="url(#paper)"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <path d="M120 608 C420 480 690 656 980 534 C1190 446 1350 495 1480 386" fill="none" stroke="url(#ink-line)" stroke-width="2.2" opacity="0.36" stroke-dasharray="720 720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" values="720;0;0;720" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.42;0.30;0.18" dur="16s" repeatCount="indefinite"/>
  </path>
  <circle cx="1478" cy="386" r="5" fill="#171717" opacity="0.45">
    <animate attributeName="cx" values="120;420;690;980;1190;1350;1480" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="608;480;656;534;446;495;386" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0.35;0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { fill: #8f6a35; font-size: 23px; font-weight: 760; letter-spacing: 6px; }
    .title { fill: #171717; font-family: Georgia, "Times New Roman", serif; font-size: 112px; font-weight: 500; letter-spacing: 0; }
    .subtitle { fill: #25221e; font-size: 31px; font-weight: 560; }
    .body { fill: #4f4a43; font-size: 25px; font-weight: 430; }
    .small { fill: #81786d; font-size: 20px; font-weight: 470; }
    .metric-value { fill: #171717; font-family: Georgia, "Times New Roman", serif; font-size: 66px; font-weight: 500; }
    .metric-label { fill: #81786d; font-size: 17px; font-weight: 760; letter-spacing: 2.6px; }
    .section-title { fill: #171717; font-family: Georgia, "Times New Roman", serif; font-size: 50px; font-weight: 500; }
    .tag { fill: #25221e; font-size: 22px; font-weight: 650; }
    .panel, .project-card rect, .action-card { fill: #fffdf8; fill-opacity: 0.72; stroke: #d7cbbb; stroke-width: 1.2; filter: url(#soft-shadow); }
    .project-name { fill: #171717; font-size: 29px; font-weight: 760; }
    .project-meta { fill: #8f6a35; font-size: 18px; font-weight: 720; }
    .project-desc { fill: #5b554d; font-size: 20px; font-weight: 430; }
    .link { fill: #3a5271; font-size: 24px; font-weight: 700; }
    .rule { stroke: url(#ink-line); stroke-width: 2; stroke-linecap: round; }
  </style>

  <text class="section-title" x="110" y="94">Selected Public Work</text>
  <text class="small" x="110" y="136">Synchronized from public/github-projects.json. Click for repository links.</text>

  <g class="project-card" transform="translate(110 194)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="8.0s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">AstrBot</text>
    <text class="project-meta" x="24" y="72">Python / 35,836 stars / 2,476 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">AI Agent Assistant &amp;</tspan><tspan x="24" dy="24">development framework</tspan><tspan x="24" dy="24">that integrates lots...</tspan></text>
  </g>
  <g class="project-card" transform="translate(594 194)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="8.45s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">astrbot-launcher</text>
    <text class="project-meta" x="24" y="72">Rust / 1,185 stars / 13 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">AstrBot Launcher是一款用于图形化</tspan><tspan x="24" dy="24">管理AstrBot的桌面应用程序，提供版本下载、</tspan><tspan x="24" dy="24">...</tspan></text>
  </g>
  <g class="project-card" transform="translate(1078 194)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="8.9s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">AstrBot-desktop</text>
    <text class="project-meta" x="24" y="72">Rust / 632 stars / 27 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">The desktop edition of</tspan><tspan x="24" dy="24">AstrBot, designed for</tspan><tspan x="24" dy="24">fast local...</tspan></text>
  </g>
  <g class="project-card" transform="translate(110 398)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="9.35s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">shipyard-neo</text>
    <text class="project-meta" x="24" y="72">Python / 80 stars / 14 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">The Secure, Persistent</tspan><tspan x="24" dy="24">Execution Platform for</tspan><tspan x="24" dy="24">AI Agents</tspan></text>
  </g>
  <g class="project-card" transform="translate(594 398)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="9.8s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">AstrBot_Plugins_Collection</text>
    <text class="project-meta" x="24" y="72">Python / 94 stars / 66 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">AstrBot Plugin</tspan><tspan x="24" dy="24">Collections</tspan></text>
  </g>
  <g class="project-card" transform="translate(1078 398)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="10.25s" repeatCount="indefinite"/>
    <rect width="450" height="170" rx="22"/>
    <text class="project-name" x="24" y="42">OniMods</text>
    <text class="project-meta" x="24" y="72">C# / 7 stars / 2 forks</text>
    <text class="project-desc" x="24" y="106"><tspan x="24" dy="0">oxygen not included</tspan></text>
  </g>

</svg>
