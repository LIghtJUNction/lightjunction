<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction ASCII flame projects</title>
  <desc id="desc">Compact selected-work strip over dense orange ASCII flame.</desc>
  <rect width="1600" height="260" fill="#050505"/>
  <style>
    text { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    .fire { fill: #ff7a16; font-size: 19px; font-weight: 900; white-space: pre; }
    .frame { fill: #7a2d0d; font-size: 14px; opacity: .76; }
    .repo { fill: #ffbf61; font-size: 21px; font-weight: 900; }
    .meta { fill: #ff8a1d; font-size: 14px; font-weight: 800; }
    .dim { fill: #b94c12; font-size: 14px; }
  </style>
  <text class="frame" x="10" y="22">==== selected-work ================================================================================</text>
  <g transform="translate(685 28) rotate(-7) scale(1.22)">
    <animate attributeName="opacity" values=".72;1;.8;.95;.72" dur="1.3s" repeatCount="indefinite"/>
    <text class="fire" x="-170" y="30">---------------++++++++++++++++***###%%%%%%%%%%%%@@@@@@%%%%%%%###***++++++++++--------------------</text>
    <text class="fire" x="-130" y="56">----------+++++++++++++***###%%%%@@@@@@@@@@@@@@@@@@@@@@@@@%%%%###***++++++++----------------------</text>
    <text class="fire" x="-86" y="82">------+++++++++***###%%%%@@@@@@%%%%%%############%%%%%%@@@@%%%%###***++++------------------------</text>
    <text class="fire" x="-42" y="108">----++++++***###%%%%#####*******++++++++++++++++++****#####%%%###***+++--------------------------</text>
    <text class="fire" x="0" y="134">--++++***#####*****+++++++=====================+++++++*****###***+++-----------------------------</text>
  </g>
  <text class="repo" x="58" y="78">AstrBot</text>
  <text class="meta" x="58" y="102">Python / 35,836 stars / 2,476 forks</text>
  <text class="repo" x="58" y="144">astrbot-launcher</text>
  <text class="meta" x="58" y="168">Rust / 1,185 stars / 13 forks</text>
  <text class="repo" x="58" y="210">OniMods</text>
  <text class="meta" x="58" y="234">C# / game automation and MCP tooling</text>
  <text class="dim" x="1170" y="234">click -&gt; PROFILE_ACTIONS.md#repositories</text>
</svg>
