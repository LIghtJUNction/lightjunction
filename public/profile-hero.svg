<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction ASCII flame hero</title>
  <desc id="desc">Animated terminal-style README hero with a rotated enlarged ASCII flame.</desc>
  <rect width="1600" height="760" fill="#050403"/>
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="42%" stop-color="#ff7a18"/>
      <stop offset="72%" stop-color="#e23b10"/>
      <stop offset="100%" stop-color="#6f1609"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="-8 .5 .5;10 .5 .5;-8 .5 .5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="50%" stop-color="#f7f1cf"/>
      <stop offset="100%" stop-color="#ff6d1a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1600" height="18" patternUnits="userSpaceOnUse">
      <rect width="1600" height="2" fill="#ff9b2f" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1600" height="760" fill="url(#scan)">
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 18" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <style>
    text { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    .frame { fill: #9b3c14; font-size: 19px; opacity: .78; }
    .flame { fill: url(#ember); font-size: 28px; font-weight: 800; white-space: pre; }
    .flame2 { fill: #ffb02e; font-size: 28px; font-weight: 800; opacity: .62; white-space: pre; }
    .title { fill: url(#metal); font-size: 84px; font-weight: 900; }
    .sub { fill: #f9b25b; font-size: 30px; font-weight: 700; }
    .body { fill: #df7d35; font-size: 24px; font-weight: 650; }
    .dim { fill: #8d3a19; font-size: 20px; }
    .tag { fill: #ffdf91; font-size: 22px; font-weight: 800; }
  </style>
  <g class="frame">
    <text x="18" y="30">===[ /home/lightjunction :: public README console ]==============================================</text>
    <text x="18" y="730">================================================================================================</text>
  </g>
  <g transform="translate(930 70) rotate(-7) scale(1.34)" filter="url(#glow)">
    <g class="flame">
      <animateTransform attributeName="transform" type="translate" values="0 0;14 -10;-8 6;0 0" dur="1.8s" repeatCount="indefinite"/>
      <text x="0" y="28">+++++++++++++++++++++++##%%%@%%%%%##++++++++++++</text>
      <text x="-34" y="60">+++++++++++++++***###%%%%@@@@@@@@@%%%%###***+++++</text>
      <text x="-64" y="92">------+++++***###%%%@@@@@@@%%%@@@@@@@%%%###***++</text>
      <text x="-92" y="124">----------+++**###%%%%@@%%%%####%%%%@@%%%%###***</text>
      <text x="-116" y="156">-------------+++**##%%%%%###******###%%%%%##**++</text>
      <text x="-130" y="188">---------------++**##%%%##***++++***##%%%##**++</text>
      <text x="-122" y="220">-----------------++*###%##**++==++**##%###*++--</text>
      <text x="-92" y="252">-------------------++**###**+====+**###**++----</text>
      <text x="-52" y="284">---------------------++*****+====+*****++-------</text>
      <text x="-8" y="316">------------------------++++======++++----------</text>
    </g>
    <g class="flame2">
      <animate attributeName="opacity" values=".25;.85;.42;.7;.25" dur="1.15s" repeatCount="indefinite"/>
      <text x="-18" y="44">..............*****#####%%%%%%%%#####*****........</text>
      <text x="-52" y="76">.........+++++***###%%@@@@@@@@@@@@%%###***++++...</text>
      <text x="-78" y="108">------++++***###%%%%@@@@@%%%%%@@@@@%%%%###***+++</text>
      <text x="-102" y="140">---------+++***####%%%%###*****###%%%%####***+++</text>
      <text x="-118" y="172">-------------+++**####***+++++++***####**+++----</text>
      <text x="-104" y="204">----------------++****++=========++****++-------</text>
    </g>
  </g>
  <g>
    <text class="tag" x="92" y="132">ASCII-FLAME PROFILE / ROTATED SIGNAL</text>
    <text class="title" x="88" y="238">LIghtJUNction</text>
    <text class="sub" x="94" y="302">AI tooling / Linux automation / agent workflows</text>
    <text class="body" x="96" y="380">&gt; terminal-first systems that survive real machines</text>
    <text class="body" x="96" y="424">&gt; small verified actions over noisy automation</text>
    <text class="body" x="96" y="468">&gt; human-owned assets, auditable assistant work</text>
    <text class="dim" x="96" y="556">click this panel -&gt; PROFILE_ACTIONS.md#quick-links</text>
  </g>
  <g opacity=".72">
    <text class="frame" x="92" y="640">+---------------------------------------------------------------------------+</text>
    <text class="frame" x="92" y="672">| README facade rebuilt as a live terminal surface: no glass, no placeholder |</text>
    <text class="frame" x="92" y="704">+---------------------------------------------------------------------------+</text>
  </g>
</svg>
