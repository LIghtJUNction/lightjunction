<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction dense ASCII flame hero</title>
  <desc id="desc">Dense orange ASCII flame, rotated and enlarged on a black field.</desc>
  <rect width="1600" height="360" fill="#050505"/>
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2d0d"/>
      <stop offset="18%" stop-color="#c65a15"/>
      <stop offset="45%" stop-color="#ffb23e"/>
      <stop offset="72%" stop-color="#ff6a1a"/>
      <stop offset="100%" stop-color="#9e2a0a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.18 0;.18 0;-.18 0" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="ember-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    .fire { fill: url(#fire); font-size: 26px; font-weight: 900; white-space: pre; }
    .hot { fill: #ff9a24; font-size: 26px; font-weight: 900; opacity: .46; white-space: pre; }
    .frame { fill: #7a2d0d; font-size: 15px; opacity: .72; }
    .label { fill: #ffbf61; font-size: 20px; font-weight: 800; }
    .dim { fill: #a84412; font-size: 16px; }
  </style>
  <g class="frame">
    <text x="10" y="22">==== /home/lightjunction :: README.ASCII_FIRE ======================================================</text>
    <text x="10" y="342">====================================================================================================</text>
  </g>
  <g transform="translate(330 54) rotate(-7) scale(1.34)" filter="url(#ember-glow)">
    <g class="fire">
      <animateTransform attributeName="transform" type="translate" values="0 0;18 -5;-10 4;0 0" dur="1.4s" repeatCount="indefinite"/>
      <text x="-210" y="30">------------------------------+++++++++++++++++++++++++***###%%%%%%%%%%%%@@@@@@@%%%%%%%###***++++++</text>
      <text x="-180" y="58">-----------------------+++++++++++++++++++++***###%%%%%%%@@@@@@@@@@@@@@@@@@@@@@@%%%%%%%%###***+++++</text>
      <text x="-145" y="86">----------------++++++++++++++++++++***###%%%%%%%%@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%%%%%%%###***+++</text>
      <text x="-120" y="114">----------+++++++++++++++***###%%%%%%%%@@@@@@@@@@@@@@@@%%%%%%@@@@@@@%%%%%%@@@@@@@@@@%%%%%%###***+++</text>
      <text x="-95" y="142">------++++++++++++***###%%%%%%%%@@@@@@@%%%%%%%%%%%%####*****#########%%%%%%@@@@@@%%%%%%###***++++--</text>
      <text x="-72" y="170">----+++++++++***###%%%%%%@@@@%%%%%#####********++++++++++++++****#####%%%%%%@@%%%%###***++++-------</text>
      <text x="-44" y="198">---++++++***###%%%%%%####********+++++++++=================+++++++****####%%%%###***++++-----------</text>
      <text x="-18" y="226">--++++***#######*****++++++++=============================++++++++*****####***++++------------------</text>
      <text x="10" y="254">-+++*****+++++++=======================================+++++++++*****++++--------------------------</text>
    </g>
    <g class="hot">
      <animate attributeName="opacity" values=".18;.62;.28;.52;.18" dur=".9s" repeatCount="indefinite"/>
      <text x="-240" y="44">--------------------------++++++++++++++****####%%%%%%%%%%%%%@@@@%%%%%%%%####****++++-------------</text>
      <text x="-190" y="72">-------------------++++++++++++****####%%%%%@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%%####****++++----------</text>
      <text x="-132" y="100">-------------+++++++++***####%%%%%%%@@@@@@@@@@@%%%%%%%###%%%%%%@@@@@@@@%%%%%%%####***++++--------</text>
      <text x="-82" y="128">--------+++++++***###%%%%%%%@@@@%%%%%#####***************#####%%%%%%@@@@%%%%###***++++------------</text>
      <text x="-34" y="156">-----++++***####%%%%####********++++++++================+++++++****####%%%%###***+++---------------</text>
    </g>
  </g>
  <g>
    <text class="label" x="58" y="86">LIghtJUNction // ASCII-FLAME PROFILE</text>
    <text class="dim" x="60" y="316">click -&gt; PROFILE_ACTIONS.md#quick-links</text>
  </g>
</svg>
