<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction ASCII flame pulse</title>
  <desc id="desc">Compact live-data strip over dense orange ASCII flame.</desc>
  <rect width="1600" height="220" fill="#050505"/>
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#71300e"/>
      <stop offset="45%" stop-color="#ffc24b"/>
      <stop offset="100%" stop-color="#e74412"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.12 0;.18 0;-.12 0" dur="2.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    .fire { fill: url(#fire); font-size: 20px; font-weight: 900; white-space: pre; }
    .frame { fill: #7a2d0d; font-size: 14px; opacity: .76; }
    .num { fill: #ff8a1d; font-size: 46px; font-weight: 900; }
    .label { fill: #ffbf61; font-size: 15px; font-weight: 800; }
    .dim { fill: #a84412; font-size: 14px; }
  </style>
  <text class="frame" x="10" y="22">==== live-data ====================================================================================</text>
  <g transform="translate(620 26) rotate(-6) scale(1.18)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;14 -3;-8 3;0 0" dur="1.2s" repeatCount="indefinite"/>
    <text class="fire" x="-220" y="28">----------------++++++++++++++++++***###%%%%%%%%%%@@@@@@@%%%%%%%%###***++++++++++++++---------------</text>
    <text class="fire" x="-170" y="54">------------+++++++++++++++***###%%%%@@@@@@@@@@@@@@@@@@@@@@@%%%%###***++++++++++++------------------</text>
    <text class="fire" x="-122" y="80">--------+++++++++++***###%%%%@@@@@@@%%%%%%%%%%@@@@%%%%%%@@@@@@%%%%###***+++++++--------------------</text>
    <text class="fire" x="-72" y="106">-----+++++++***###%%%%%%%#####********+++++++++******#####%%%%%%###***++++-------------------------</text>
    <text class="fire" x="-24" y="132">---++++***#####******++++++++=================+++++++*****####***++++------------------------------</text>
  </g>
  <text class="num" x="58" y="110">113</text>
  <text class="label" x="62" y="136">PUBLIC REPOS</text>
  <text class="num" x="206" y="110">85</text>
  <text class="label" x="210" y="136">FOLLOWERS</text>
  <text class="num" x="336" y="110">145</text>
  <text class="label" x="340" y="136">PROJECT CARDS</text>
  <text class="dim" x="60" y="180">latest public report: WORK_REPORT/2026/07/05.md  |  click -&gt; PROFILE_ACTIONS.md#live-data</text>
</svg>
