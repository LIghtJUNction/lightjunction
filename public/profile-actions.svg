<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220" role="img" aria-labelledby="title desc">
  <title id="title">LIghtJUNction ASCII flame actions</title>
  <desc id="desc">Compact command strip over dense orange ASCII flame.</desc>
  <rect width="1600" height="220" fill="#050505"/>
  <style>
    text { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 0; }
    .fire { fill: #ff7a16; font-size: 20px; font-weight: 900; white-space: pre; }
    .frame { fill: #7a2d0d; font-size: 14px; opacity: .76; }
    .cmd { fill: #ffbf61; font-size: 23px; font-weight: 900; }
    .dim { fill: #b94c12; font-size: 14px; }
  </style>
  <text class="frame" x="10" y="22">==== command-links ================================================================================</text>
  <g transform="translate(690 30) rotate(-6) scale(1.18)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;16 -4;-6 3;0 0" dur="1.35s" repeatCount="indefinite"/>
    <text class="fire" x="-180" y="28">----------------+++++++++++++++***###%%%%%%%%%%@@@@@@%%%%%%%%###***+++++++++++--------------------</text>
    <text class="fire" x="-126" y="54">-----------++++++++++***###%%%%@@@@@@@@@@@@@@@@@@@@@@@%%%%###***+++++++--------------------------</text>
    <text class="fire" x="-74" y="80">-------+++++++***###%%%%%%######*************######%%%%%%###***++++------------------------------</text>
    <text class="fire" x="-20" y="106">----++++***#####******+++++++=============+++++++*****####***++++--------------------------------</text>
  </g>
  <text class="cmd" x="58" y="78">$ npx skills add LIghtJUNction/lightjunction -g</text>
  <text class="cmd" x="58" y="122">$ curl -sSL .../bootstrap-linux.sh | bash</text>
  <text class="cmd" x="58" y="166">$ open WORK_REPORT/index.md</text>
  <text class="dim" x="60" y="202">click -&gt; PROFILE_ACTIONS.md#copyable-commands</text>
</svg>
